name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['SiiMobile.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create RN project and merge SiiMobile files
        run: |
          unzip -q SiiMobile.zip -d pack
          npx --yes @react-native-community/cli@latest init SiiMobile --version 0.76.9 --package-name com.siimobile --skip-git-init
          cd SiiMobile
          npm install react-native-linear-gradient
          cp -r ../pack/SiiMobile/src ../pack/SiiMobile/assets .
          cp ../pack/SiiMobile/App.tsx .
          cp -r ../pack/SiiMobile/android/app/src/main/java/com/siimobile/macro android/app/src/main/java/com/siimobile/
          cp -r ../pack/SiiMobile/android/app/src/main/res/xml android/app/src/main/res/
          cp ../pack/SiiMobile/android/app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
      - name: Patch manifest and MainApplication
        working-directory: SiiMobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          A=android/app/src/main/java/com/siimobile/MainApplication.kt
          printf '%s\n' \
            '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>' \
            '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' \
            '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>' \
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' \
            > perms.xml
          printf '%s\n' \
            '<service android:name=".macro.MacroAccessibilityService"' \
            ' android:exported="false"' \
            ' android:label="@string/app_name"' \
            ' android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">' \
            '<intent-filter>' \
            '<action android:name="android.accessibilityservice.AccessibilityService"/>' \
            '</intent-filter>' \
            '<meta-data android:name="android.accessibilityservice"' \
            ' android:resource="@xml/accessibility_service_config"/>' \
            '</service>' \
            '<service android:name=".macro.RecorderOverlayService"' \
            ' android:exported="false"' \
            ' android:foregroundServiceType="specialUse">' \
            '<property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"' \
            ' android:value="macro recording overlay"/>' \
            '</service>' \
            '<service android:name=".macro.AutomationForegroundService"' \
            ' android:exported="false"' \
            ' android:foregroundServiceType="specialUse">' \
            '<property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"' \
            ' android:value="macro playback"/>' \
            '</service>' \
            '<receiver android:name=".macro.StopReceiver" android:exported="false">' \
            '<intent-filter>' \
            '<action android:name="com.siimobile.macro.STOP_ALL"/>' \
            '</intent-filter>' \
            '</receiver>' \
            > frag.xml
          sed -i '/<application/e cat perms.xml' $M
          sed -i '/<\/application>/e cat frag.xml' $M
          sed -i 's|PackageList(this).packages.apply {|&\n add(com.siimobile.macro.MacroPackage())|' $A
          grep -n "MacroPackage" $A
          grep -c "MacroAccessibilityService" $M
      - name: Build release APK
        working-directory: SiiMobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SiiMobile-APK
          path: SiiMobile/android/app/build/outputs/apk/release/app-release.apk
